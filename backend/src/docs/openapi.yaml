openapi: 3.0.0
info:
  title: API de Inmobiliaria
  description: API para gestionar propiedades, usuarios y clientes en un sistema de inmobiliaria.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
paths:
  /properties:
    get:
      summary: Obtener todas las propiedades
      responses:
        '200':
          description: Lista de propiedades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
    post:
      summary: Crear una nueva propiedad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Property'
      responses:
        '201':
          description: Propiedad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
  /properties/{id}:
    get:
      summary: Obtener una propiedad específica
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la propiedad
          schema:
            type: string
      responses:
        '200':
          description: Propiedad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Propiedad no encontrada
    put:
      summary: Actualizar una propiedad existente
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la propiedad
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Property'
      responses:
        '200':
          description: Propiedad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Propiedad no encontrada
    delete:
      summary: Eliminar una propiedad
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la propiedad
          schema:
            type: string
      responses:
        '204':
          description: Propiedad eliminada
        '404':
          description: Propiedad no encontrada
  /users:
    get:
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    put:
      summary: Actualizar un usuario existente
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado
    delete:
      summary: Eliminar un usuario
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
      responses:
        '204':
          description: Usuario eliminado
        '404':
          description: Usuario no encontrado
  /auth/login:
    post:
      summary: Autenticación de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Credenciales inválidas
  /auth/logout:
    post:
      summary: Cierre de sesión
      responses:
        '204':
          description: Cierre de sesión exitoso
components:
  schemas:
    Property:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        location:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time